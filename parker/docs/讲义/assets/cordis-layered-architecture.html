<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cordis 分层与一切皆插件</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 1350px; overflow: hidden; background: #f8fafc; }
    body { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172033; }
    svg { display: block; width: 1600px; height: 1350px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1600 1350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">Cordis 分层与一切皆插件</title>
    <desc id="desc">从底向上展示 Cordis 内核、DeepSeek Harness 插件实现、Agent Runtime 能力与配置组合的分层架构图。</desc>
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
      </filter>
      <marker id="arrow-blue" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#3b82f6"/>
      </marker>
      <marker id="arrow-green" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#10b981"/>
      </marker>
      <marker id="arrow-orange" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#f59e0b"/>
      </marker>
      <marker id="arrow-purple" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#8b5cf6"/>
      </marker>
    </defs>

    <rect width="1600" height="1350" fill="#f8fafc"/>

    <text x="70" y="62" font-size="34" font-weight="750" fill="#101828">Cordis 分层与「一切皆插件」</text>
    <text x="70" y="98" font-size="18" fill="#667085">从底向上：Cordis 内核提供基础机制 → Plugin 实现能力 → Agent Runtime 获得能力 → 配置完成组合</text>

    <!-- Layer 1: configuration -->
    <g filter="url(#shadow)">
      <rect x="60" y="128" width="1480" height="275" rx="22" fill="#eaf3ff" stroke="#72a9ff" stroke-width="2"/>
    </g>
    <text x="92" y="170" font-size="24" font-weight="700" fill="#175cd3">④ 配置分层</text>
    <text x="1458" y="169" font-size="16" text-anchor="end" fill="#475467">从低优先级 → 高优先级；后应用的层覆盖前层相同 id</text>

    <g>
      <rect x="90" y="214" width="250" height="118" rx="13" fill="#ffffff" stroke="#72a9ff" stroke-width="2"/>
      <rect x="108" y="229" width="54" height="24" rx="12" fill="#eaf3ff"/>
      <text x="135" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#175cd3">ROOT</text>
      <text x="175" y="251" font-size="19" font-weight="700">Profile cordis.yml</text>
      <text x="215" y="279" font-size="15" fill="#667085" text-anchor="middle">空配置根</text>
      <text x="215" y="303" font-size="15" fill="#667085" text-anchor="middle">模块解析锚点</text>
    </g>
    <g>
      <rect x="375" y="214" width="250" height="118" rx="13" fill="#ffffff" stroke="#72a9ff" stroke-width="2"/>
      <circle cx="402" cy="241" r="16" fill="#175cd3"/>
      <text x="402" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">P1</text>
      <text x="500" y="247" font-size="19" font-weight="700" text-anchor="middle">Bundle Patches</text>
      <text x="500" y="276" font-size="14" fill="#667085" text-anchor="middle">package.json</text>
      <text x="500" y="300" font-size="14" fill="#175cd3" font-weight="650" text-anchor="middle">dsh.profile.bundles 顺序</text>
    </g>
    <g>
      <rect x="660" y="214" width="250" height="118" rx="13" fill="#ffffff" stroke="#72a9ff" stroke-width="2"/>
      <circle cx="687" cy="241" r="16" fill="#175cd3"/>
      <text x="687" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">P2</text>
      <text x="785" y="247" font-size="19" font-weight="700" text-anchor="middle">Profile Patch</text>
      <text x="785" y="276" font-size="14" fill="#667085" text-anchor="middle">profiles/web/cordis.patch.yml</text>
      <text x="785" y="300" font-size="14" fill="#175cd3" font-weight="650" text-anchor="middle">单个 Profile · 持久 + 热更新</text>
    </g>
    <g>
      <rect x="945" y="214" width="250" height="118" rx="13" fill="#ffffff" stroke="#72a9ff" stroke-width="2"/>
      <circle cx="972" cy="241" r="16" fill="#175cd3"/>
      <text x="972" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">P3</text>
      <text x="1070" y="247" font-size="19" font-weight="700" text-anchor="middle">Home Patch</text>
      <text x="1070" y="276" font-size="14" fill="#667085" text-anchor="middle">$DSH_HOME/cordis.patch.yml</text>
      <text x="1070" y="300" font-size="14" fill="#175cd3" font-weight="650" text-anchor="middle">全部 Profile · 持久 + 热更新</text>
    </g>
    <g>
      <rect x="1230" y="214" width="250" height="118" rx="13" fill="#ffffff" stroke="#72a9ff" stroke-width="2"/>
      <circle cx="1257" cy="241" r="16" fill="#175cd3"/>
      <text x="1257" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">P4</text>
      <text x="1355" y="247" font-size="19" font-weight="700" text-anchor="middle">Launcher Patch</text>
      <text x="1355" y="276" font-size="14" fill="#667085" text-anchor="middle">--patch file.yml</text>
      <text x="1355" y="300" font-size="14" fill="#175cd3" font-weight="650" text-anchor="middle">当前进程 · argv 顺序</text>
    </g>
    <rect x="240" y="350" width="520" height="34" rx="17" fill="#ffffff" stroke="#72a9ff" stroke-width="1.5"/>
    <text x="500" y="373" font-size="15" font-weight="650" text-anchor="middle" fill="#175cd3">最终 Host Composition / Entry 配置树</text>
    <rect x="840" y="350" width="520" height="34" rx="17" fill="#fff8ed" stroke="#f79009" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="1100" y="373" font-size="14" font-weight="650" text-anchor="middle" fill="#b54708">热更新：稳定 id 重组 · Effect 回卷 · Fiber 重载</text>

    <!-- Every cross-layer arrow points upward -->
    <line x1="800" y1="462" x2="800" y2="407" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="642" y="417" width="316" height="30" rx="15" fill="#f8fafc"/>
    <text x="800" y="438" font-size="15" font-weight="650" text-anchor="middle" fill="#175cd3">配置选择、替换与扩展能力</text>

    <!-- Layer 3: capabilities exposed by plugins -->
    <g filter="url(#shadow)">
      <rect x="60" y="462" width="1480" height="205" rx="22" fill="#e9fbf3" stroke="#51d49a" stroke-width="2"/>
    </g>
    <text x="92" y="504" font-size="24" font-weight="700" fill="#087a55">③ Agent Runtime 能力层</text>
    <text x="1458" y="503" font-size="16" text-anchor="end" fill="#475467">Plugin 最终向 Host 与 Agent 提供的能力</text>

    <g>
      <rect x="84" y="535" width="220" height="92" rx="14" fill="#ffffff" stroke="#31c48d" stroke-width="2"/>
      <text x="194" y="573" font-size="19" font-weight="700" text-anchor="middle">Model &amp; Routing</text>
      <text x="194" y="603" font-size="14" fill="#087a55" text-anchor="middle">LLM · Provider · Route</text>
    </g>
    <g>
      <rect x="326" y="535" width="220" height="92" rx="14" fill="#ffffff" stroke="#31c48d" stroke-width="2"/>
      <text x="436" y="573" font-size="19" font-weight="700" text-anchor="middle">Tools &amp; Skills</text>
      <text x="436" y="603" font-size="14" fill="#087a55" text-anchor="middle">Tool Registry · Skill</text>
    </g>
    <g>
      <rect x="568" y="535" width="220" height="92" rx="14" fill="#ffffff" stroke="#31c48d" stroke-width="2"/>
      <text x="678" y="573" font-size="19" font-weight="700" text-anchor="middle">Agent Loop</text>
      <text x="678" y="603" font-size="14" fill="#087a55" text-anchor="middle">循环 · 调度 · 执行</text>
    </g>
    <g>
      <rect x="810" y="535" width="220" height="92" rx="14" fill="#ffffff" stroke="#31c48d" stroke-width="2"/>
      <text x="920" y="573" font-size="19" font-weight="700" text-anchor="middle">Session &amp; Storage</text>
      <text x="920" y="603" font-size="14" fill="#087a55" text-anchor="middle">会话 · 日志 · 持久化</text>
    </g>
    <g>
      <rect x="1052" y="535" width="220" height="92" rx="14" fill="#ffffff" stroke="#31c48d" stroke-width="2"/>
      <text x="1162" y="573" font-size="19" font-weight="700" text-anchor="middle">Sandbox &amp; FS</text>
      <text x="1162" y="603" font-size="14" fill="#087a55" text-anchor="middle">权限 · 文件 · 进程</text>
    </g>
    <g>
      <rect x="1294" y="535" width="220" height="92" rx="14" fill="#ffffff" stroke="#31c48d" stroke-width="2"/>
      <text x="1404" y="568" font-size="18" font-weight="700" text-anchor="middle">Subagent · UI</text>
      <text x="1404" y="594" font-size="14" fill="#087a55" text-anchor="middle">Workflow · Trajectory</text>
      <text x="1404" y="614" font-size="13" fill="#087a55" text-anchor="middle">Web UI</text>
    </g>

    <line x1="800" y1="784" x2="800" y2="671" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-green)"/>
    <rect x="644" y="702" width="312" height="32" rx="16" fill="#f8fafc"/>
    <text x="800" y="724" font-size="15" font-weight="650" text-anchor="middle" fill="#087a55">Plugin 向上贡献 Runtime 能力</text>

    <!-- Layer 2: plugins -->
    <g filter="url(#shadow)">
      <rect x="60" y="784" width="1480" height="214" rx="22" fill="#f2edff" stroke="#a98bff" stroke-width="2"/>
    </g>
    <text x="92" y="826" font-size="24" font-weight="700" fill="#6941c6">② DeepSeek Harness Plugin 实现层</text>
    <text x="1458" y="825" font-size="16" text-anchor="end" fill="#475467">模型、工具、循环、会话、沙箱、UI 都由独立 Plugin Entry 提供</text>

    <g>
      <rect x="92" y="858" width="330" height="100" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="257" y="895" font-size="19" font-weight="700" text-anchor="middle">Service Provider Plugins</text>
      <text x="257" y="927" font-size="16" fill="#6941c6" font-weight="650" text-anchor="middle">tools · llm · agents</text>
    </g>
    <g>
      <rect x="455" y="858" width="330" height="100" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="620" y="895" font-size="19" font-weight="700" text-anchor="middle">Consumer Plugins</text>
      <text x="620" y="927" font-size="16" fill="#6941c6" font-weight="650" text-anchor="middle">greet tool · provider consumer</text>
    </g>
    <g>
      <rect x="818" y="858" width="330" height="100" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="983" y="895" font-size="19" font-weight="700" text-anchor="middle">Runtime Plugins</text>
      <text x="983" y="927" font-size="16" fill="#6941c6" font-weight="650" text-anchor="middle">agent-loop · session · sandbox</text>
    </g>
    <g>
      <rect x="1181" y="858" width="327" height="100" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="1344" y="895" font-size="19" font-weight="700" text-anchor="middle">UI Plugins</text>
      <text x="1344" y="927" font-size="16" fill="#6941c6" font-weight="650" text-anchor="middle">running-ant · Web UI</text>
    </g>

    <!-- Cordis core is the foundation under every plugin -->
    <line x1="800" y1="1068" x2="800" y2="1002" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <rect x="582" y="1017" width="436" height="30" rx="15" fill="#f8fafc"/>
    <text x="800" y="1038" font-size="15" font-weight="650" text-anchor="middle" fill="#b54708">Cordis 内核向上提供 Service / Effect / 生命周期</text>

    <!-- Layer 1: Cordis core foundation -->
    <g filter="url(#shadow)">
      <rect x="60" y="1068" width="1480" height="214" rx="22" fill="#fff5e7" stroke="#ffad4d" stroke-width="2"/>
    </g>
    <text x="92" y="1110" font-size="24" font-weight="700" fill="#b54708">① Cordis 内核｜基础层</text>
    <text x="1458" y="1109" font-size="16" text-anchor="end" fill="#475467">提供插件协作与生命周期机制，不承载具体 Agent 业务能力</text>

    <g>
      <rect x="84" y="1142" width="270" height="100" rx="14" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
      <text x="219" y="1177" font-size="20" font-weight="700" text-anchor="middle">Context / ctx</text>
      <text x="219" y="1205" font-size="14" fill="#667085" text-anchor="middle">插件访问运行时的入口</text>
      <text x="219" y="1228" font-size="12" fill="#b54708" text-anchor="middle">ctx.plugin · ctx.effect · ctx.on</text>
    </g>
    <g>
      <rect x="374" y="1142" width="270" height="100" rx="14" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
      <text x="509" y="1177" font-size="20" font-weight="700" text-anchor="middle">Loader + Fiber</text>
      <text x="509" y="1205" font-size="14" fill="#667085" text-anchor="middle">Entry 挂载为插件实例</text>
      <text x="509" y="1228" font-size="12" fill="#b54708" text-anchor="middle">stable id · apply(ctx)</text>
    </g>
    <g>
      <rect x="664" y="1142" width="270" height="100" rx="14" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
      <text x="799" y="1177" font-size="20" font-weight="700" text-anchor="middle">Service + inject</text>
      <text x="799" y="1205" font-size="14" fill="#667085" text-anchor="middle">具名能力与依赖关系</text>
      <text x="799" y="1228" font-size="12" fill="#b54708" text-anchor="middle">tools · llm · agents</text>
    </g>
    <g>
      <rect x="954" y="1142" width="270" height="100" rx="14" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
      <text x="1089" y="1177" font-size="20" font-weight="700" text-anchor="middle">Event</text>
      <text x="1089" y="1205" font-size="14" fill="#667085" text-anchor="middle">插件间发送与监听事件</text>
      <text x="1089" y="1228" font-size="12" fill="#b54708" text-anchor="middle">ctx.on · ctx.emit</text>
    </g>
    <g>
      <rect x="1244" y="1142" width="270" height="100" rx="14" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
      <text x="1379" y="1177" font-size="20" font-weight="700" text-anchor="middle">Effect</text>
      <text x="1379" y="1205" font-size="14" fill="#667085" text-anchor="middle">注册与资源归属 Fiber</text>
      <text x="1379" y="1228" font-size="12" fill="#b54708" text-anchor="middle">卸载时撤销 / disposer</text>
    </g>

    <rect x="60" y="1302" width="1480" height="30" rx="15" fill="#101828"/>
    <text x="800" y="1323" font-size="15" font-weight="650" text-anchor="middle" fill="#ffffff">选择能力 = bundles　　替换能力 = 后层使用相同 id　　扩展能力 = insert 新 id</text>
  </svg>
</body>
</html>
